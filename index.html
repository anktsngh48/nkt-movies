<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NKT Movies</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Sora:wght@400;500;600&display=swap");

    :root {
      --bg: #05080f;
      --card: #111827;
      --accent: #00e5ff;
      --accent2: #7b61ff;
      --text: #e8f0fe;
      --muted: #5a6a82;
      --border: rgba(0, 229, 255, 0.12);
      --glow: 0 0 30px rgba(0, 229, 255, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Sora", sans-serif;
      overflow-x: hidden;
    }

    body {
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse 60% 50% at 20% 10%,
          rgba(0, 229, 255, 0.05),
          transparent 60%
        ),
        radial-gradient(
          ellipse 50% 40% at 80% 80%,
          rgba(123, 97, 255, 0.06),
          transparent 60%
        );
    }

    /* Welcome screen */

    #welcome-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background: var(--bg);
    }

    #welcome-screen.hidden {
      display: none;
    }

    #welcome-screen h1 {
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(2rem, 9vw, 4rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
      );
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(0, 229, 255, 0.4));
    }

    #enter-button {
      padding: 14px 42px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: rgba(0, 229, 255, 0.08);
      color: var(--accent);
      font-family: "Orbitron", sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.18);
      transition: 0.2s ease;
    }

    #enter-button:hover {
      background: rgba(0, 229, 255, 0.2);
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.4);
      transform: translateY(-2px);
    }

    /* Main page */

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    #fs-bar {
      width: 100%;
      padding: 8px 20px;
      border-bottom: 1px solid rgba(0, 229, 255, 0.09);
      background: rgba(0, 229, 255, 0.035);
      color: var(--accent);
      font-family: "Orbitron", sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-align: center;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
    }

    #fs-bar.hidden {
      display: none;
    }

    header {
      padding: 26px 20px 22px;
      border-bottom: 1px solid rgba(0, 229, 255, 0.08);
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1.5rem, 5vw, 2.3rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      background: linear-gradient(
        135deg,
        var(--accent),
        var(--accent2)
      );
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(0, 229, 255, 0.4));
    }

    header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    main {
      padding: 24px 16px;
    }

    #player-box {
      display: none;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      margin-bottom: 22px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #000;
      box-shadow:
        0 0 50px rgba(0, 229, 255, 0.13),
        0 0 100px rgba(123, 97, 255, 0.09);
    }

    #player-box.active {
      display: block;
    }

    #player-box iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    /* Fullscreen landscape player */

    #player-box:fullscreen {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: #000;
    }

    #player-box:fullscreen iframe {
      width: 100vw;
      height: 100vh;
    }

    #player-box:-webkit-full-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: #000;
    }

    #player-box:-webkit-full-screen iframe {
      width: 100vw;
      height: 100vh;
    }

    #now-playing {
      display: none;
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #now-playing.visible {
      display: block;
    }

    .section-title {
      margin: 0 0 12px;
      color: var(--text);
      font-family: "Orbitron", sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Video list */

    #video-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .video-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }

    .video-item:hover {
      border-color: rgba(0, 229, 255, 0.45);
      background: #172237;
      box-shadow: var(--glow);
      transform: translateY(-1px);
    }

    .video-item.playing {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.16);
    }

    .video-info {
      flex: 1;
      min-width: 0;
    }

    .video-title {
      margin: 0 0 5px;
      color: var(--text);
      font-size: 0.84rem;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /*
      When there is no description, remove the title's bottom margin.
      This keeps the top and bottom vertical padding equal.
    */
    .video-item.no-description .video-title {
      margin-bottom: 0;
    }

    .video-description {
      margin: 0;
      color: var(--muted);
      font-size: 0.7rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-item.no-description .video-description {
      display: none;
    }

    .open-icon {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 1.35rem;
      opacity: 0.5;
    }

    .empty-message {
      padding: 28px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      main {
        padding: 20px 12px;
      }

      #player-box {
        border-radius: 10px;
      }

      .video-title {
        font-size: 0.76rem;
      }

      .video-description {
        font-size: 0.65rem;
      }

      .open-icon {
        display: none;
      }
    }
  </style>
</head>

<body>
  <!-- Enter only enables video playback. It does not start a video. -->
  <div id="welcome-screen">
    <h1>NKT Movies</h1>
    <button id="enter-button" type="button">Enter</button>
  </div>

  <div class="page">
    <div id="fs-bar" onclick="enterFullscreen()">
      Tap here for fullscreen mode
    </div>

    <header>
      <h1>NKT Movies</h1>
      <p>Select a video to watch</p>
    </header>

    <main>
      <div id="player-box"></div>

      <div id="now-playing"></div>

      <h2 class="section-title">Available Videos</h2>

      <div id="video-list"></div>
    </main>
  </div>

  <script>
    /*
      Add your YouTube videos here.

      The description is optional.
      If you do not want a description, remove the description line.
    */

    const videos = [
      {
        title: "Welcome Video",
        description: "Introduction video",
        youtubeUrl: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      },
      {
        title: "Tutorial",
        youtubeUrl: "https://www.youtube.com/watch?v=VIDEO_ID_2"
      },
      {
        title: "Event Highlights",
        description: "Highlights from the event",
        youtubeUrl: "https://youtu.be/VIDEO_ID_3"
      },
      {
        title: "Video Without Description",
        youtubeUrl: "https://www.youtube.com/watch?v=VIDEO_ID_4"
      }
    ];

    const welcomeScreen = document.getElementById("welcome-screen");
    const enterButton = document.getElementById("enter-button");
    const videoList = document.getElementById("video-list");
    const playerBox = document.getElementById("player-box");
    const nowPlaying = document.getElementById("now-playing");

    let autoplayEnabled = false;

    function getYouTubeVideoId(url) {
      try {
        const parsedUrl = new URL(url);
        const hostname = parsedUrl.hostname.toLowerCase();
        const pathname = parsedUrl.pathname;

        if (hostname === "youtu.be") {
          return pathname.substring(1).split("/")[0];
        }

        if (
          hostname.includes("youtube.com") &&
          pathname === "/watch"
        ) {
          return parsedUrl.searchParams.get("v");
        }

        if (
          hostname.includes("youtube.com") &&
          pathname.startsWith("/shorts/")
        ) {
          return pathname.split("/shorts/")[1].split("/")[0];
        }

        if (
          hostname.includes("youtube.com") &&
          pathname.startsWith("/embed/")
        ) {
          return pathname.split("/embed/")[1].split("/")[0];
        }

        return null;
      } catch {
        return null;
      }
    }

    function renderVideos() {
      videoList.innerHTML = "";

      const validVideos = videos
        .map((video) => ({
          ...video,
          videoId: getYouTubeVideoId(video.youtubeUrl)
        }))
        .filter((video) => video.videoId);

      if (validVideos.length === 0) {
        videoList.innerHTML = `
          <div class="empty-message">
            No valid YouTube videos found.
          </div>
        `;
        return;
      }

      validVideos.forEach((video, index) => {
        const item = document.createElement("button");

        item.className = "video-item";
        item.type = "button";
        item.dataset.index = index;

        item.innerHTML = `
          <div class="video-info">
            <h3 class="video-title"></h3>
            <p class="video-description"></p>
          </div>

          <span class="open-icon">›</span>
        `;

        const titleElement = item.querySelector(".video-title");
        const descriptionElement = item.querySelector(".video-description");

        titleElement.textContent = video.title || "Untitled video";

        const description =
          typeof video.description === "string"
            ? video.description.trim()
            : "";

        descriptionElement.textContent = description;

        /*
          Hide the description and remove the title bottom margin
          when no description is provided.
        */
        if (!description) {
          item.classList.add("no-description");
        }

        item.addEventListener("click", () => {
          playVideo(video.videoId, video.title, index);
        });

        videoList.appendChild(item);
      });
    }

    function playVideo(videoId, title, index) {
      if (!autoplayEnabled) {
        return;
      }

      document.querySelectorAll(".video-item").forEach((item) => {
        item.classList.remove("playing");
      });

      const selectedItem = document.querySelector(
        `.video-item[data-index="${index}"]`
      );

      if (selectedItem) {
        selectedItem.classList.add("playing");
      }

      playerBox.innerHTML = "";

      const iframe = document.createElement("iframe");

      iframe.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoId) +
        "?autoplay=1&rel=0&playsinline=1";

      iframe.title = title || "Video player";

      iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

      iframe.allowFullscreen = true;

      playerBox.appendChild(iframe);
      playerBox.classList.add("active");

      nowPlaying.textContent =
        "▶ NOW PLAYING: " + (title || "Untitled video");

      nowPlaying.classList.add("visible");

      /*
        The user clicked the video button.
        This allows the browser to enter fullscreen.
      */
      requestPlayerFullscreen();
    }

    async function requestPlayerFullscreen() {
      const requestFullscreen =
        playerBox.requestFullscreen ||
        playerBox.webkitRequestFullscreen ||
        playerBox.mozRequestFullScreen ||
        playerBox.msRequestFullScreen;

      if (!requestFullscreen) {
        return;
      }

      try {
        await requestFullscreen.call(playerBox);

        /*
          Lock the phone to landscape mode.
          This works on supported mobile browsers.
        */
        if (
          screen.orientation &&
          screen.orientation.lock
        ) {
          await screen.orientation.lock("landscape");
        }
      } catch (error) {
        console.log(
          "Fullscreen or landscape mode is not supported by this browser."
        );
      }
    }

    function enterFullscreen() {
      if (playerBox.classList.contains("active")) {
        requestPlayerFullscreen();
      }
    }

    function handleFullscreenChange() {
      const isFullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement;

      document
        .getElementById("fs-bar")
        .classList.toggle("hidden", Boolean(isFullscreen));

      /*
        Unlock the screen when the user exits fullscreen.
        This is supported only on some browsers.
      */
      if (
        !isFullscreen &&
        screen.orientation &&
        screen.orientation.unlock
      ) {
        screen.orientation.unlock();
      }
    }

    /*
      Enter enables autoplay but does not play anything.
    */
    enterButton.addEventListener("click", () => {
      autoplayEnabled = true;
      welcomeScreen.classList.add("hidden");
    });

    [
      "fullscreenchange",
      "webkitfullscreenchange",
      "mozfullscreenchange",
      "MSFullscreenChange"
    ].forEach((eventName) => {
      document.addEventListener(eventName, handleFullscreenChange);
    });

    renderVideos();
  </script>
</body>
</html>
