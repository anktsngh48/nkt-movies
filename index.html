    @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Sora:wght@400;500;600&display=swap");

    html,

      letter-spacing: 0.12em;

    @media (max-width: 480px) {
      main {
        padding: 20px 12px;
      }

      #player-box {
        border-radius: 10px;
      }

      .video-title {
        font-size: 0.76rem;
      }

      .video-description {
        font-size: 0.65rem;
      }

      .open-icon {
        display: none;
      }

  </style>
</head>

<body>
  <!-- First page / welcome screen -->
  <div id="welcome-screen">
    <h1>NKT Movies</h1>

    <button id="enter-button" type="button">
      Let me in
    </button>

    <div class="browser-note">
      Works best on "Brave" Browser
    </div>
  </div>

  <div class="page" id="website-page">
    <button id="fs-bar" type="button">
      Tap here for fullscreen mode
    </button>

    <header>
      <h1>NKT Movies</h1>
      <p>Select a movie to watch</p>
    </header>

    <main>
      <div id="player-box"></div>

      <div id="now-playing"></div>

      <div class="search-box">
        <input
          id="search-input"
          type="search"
          placeholder="Search your movie"
          aria-label="Search videos"
        />
      </div>

      <h2 class="section-title">Available Movies</h2>

      <div id="video-list"></div>
    </main>
  </div>

  <script>
    /*
      Add your YouTube videos here.
      Replace the sample URLs with your own YouTube links.
    */
    const videos = [
      {
        title: "Welcome Video",
        description: "Introduction video",
        tags: "Shahrukh, coal, 2012",
        youtubeUrl: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      },
      {
        title: "Tutorial",
        description: "Step-by-step tutorial",
        tags: "tutorial, guide, learning",
        youtubeUrl: "https://www.youtube.com/watch?v=VIDEO_ID_2"
      },
      {
        title: "Event Highlights",
        description: "Highlights from the event",
        tags: "event, highlights, celebration",
        youtubeUrl: "https://youtu.be/VIDEO_ID_3"
      },
      {
        title: "Video Without Description",
        description: "",
        tags: "movies, entertainment",
        youtubeUrl: "https://www.youtube.com/watch?v=VIDEO_ID_4"
      }
    ];

    const welcomeScreen = document.getElementById("welcome-screen");
    const enterButton = document.getElementById("enter-button");
    const websitePage = document.getElementById("website-page");
    const fullscreenBar = document.getElementById("fs-bar");
    const videoList = document.getElementById("video-list");
    const playerBox = document.getElementById("player-box");
    const nowPlaying = document.getElementById("now-playing");
    const searchInput = document.getElementById("search-input");

    let autoplayEnabled = false;

    function getYouTubeVideoId(url) {
      try {
        const parsedUrl = new URL(url);
        const hostname = parsedUrl.hostname.toLowerCase();
        const pathname = parsedUrl.pathname;

        if (hostname === "youtu.be") {
          return pathname.substring(1).split("/")[0];
        }

        if (
          hostname.includes("youtube.com") &&
          pathname === "/watch"
        ) {
          return parsedUrl.searchParams.get("v");
        }

        if (
          hostname.includes("youtube.com") &&
          pathname.startsWith("/shorts/")
        ) {
          return pathname.split("/shorts/")[1].split("/")[0];
        }

        if (
          hostname.includes("youtube.com") &&
          pathname.startsWith("/embed/")
        ) {
          return pathname.split("/embed/")[1].split("/")[0];
        }

        return null;
      } catch {
        return null;
      }
    }

    function renderVideos() {
      videoList.innerHTML = "";

      const searchTerm = searchInput.value.trim().toLowerCase();

      const validVideos = videos
        .map((video) => ({
          ...video,
          videoId: getYouTubeVideoId(video.youtubeUrl)
        }))
        .filter((video) => video.videoId)
        .filter((video) => {
          if (!searchTerm) {
            return true;
          }

          const searchableText = [
            video.title || "",
            video.description || "",
            video.tags || ""
          ]
            .join(" ")
            .toLowerCase();

          return searchableText.includes(searchTerm);
        });

      if (validVideos.length === 0) {
        videoList.innerHTML = `
          <div class="empty-message">
            ${
              searchTerm
                ? "No videos match your search."
                : "No valid YouTube videos found."
            }
          </div>
        `;
        return;
      }

      validVideos.forEach((video) => {
        const item = document.createElement("button");

        item.className = "video-item";
        item.type = "button";

        item.innerHTML = `
          <div class="video-info">
            <h3 class="video-title"></h3>
            <p class="video-description"></p>
          </div>
          <span class="open-icon" aria-hidden="true">›</span>
        `;

        const titleElement = item.querySelector(".video-title");
        const descriptionElement = item.querySelector(
          ".video-description"
        );

        titleElement.textContent =
          video.title || "Untitled video";

        const description =
          typeof video.description === "string"
            ? video.description.trim()
            : "";

        descriptionElement.textContent = description;

        if (!description) {
          item.classList.add("no-description");
        }

        item.addEventListener("click", () => {
          playVideo(video.videoId, video.title, item);
        });

        videoList.appendChild(item);
      });
    }

    function playVideo(videoId, title, selectedItem) {
      if (!autoplayEnabled) {
        return;
      }

      document
        .querySelectorAll(".video-item")
        .forEach((item) => {
          item.classList.remove("playing");
        });

      selectedItem.classList.add("playing");

      playerBox.innerHTML = "";

      const iframe = document.createElement("iframe");

      iframe.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoId) +
        "?autoplay=1&rel=0&playsinline=1";

      iframe.title = title || "Video player";

      iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

      iframe.allowFullscreen = true;

      playerBox.appendChild(iframe);
      playerBox.classList.add("active");

      nowPlaying.textContent =
        "▶ NOW PLAYING: " + (title || "Untitled video");

      nowPlaying.classList.add("visible");

      requestVideoFullscreen();
    }

    async function requestVideoFullscreen() {
      const requestFullscreen =
        playerBox.requestFullscreen ||
        playerBox.webkitRequestFullscreen ||
        playerBox.mozRequestFullScreen ||
        playerBox.msRequestFullscreen;

      if (!requestFullscreen) {
        return;
      }

      try {
        await requestFullscreen.call(playerBox);

        if (
          screen.orientation &&
          typeof screen.orientation.lock === "function"
        ) {
          try {
            await screen.orientation.lock("landscape");
          } catch {
            console.log(
              "Landscape orientation is not supported by this browser."
            );
          }
        }
      } catch {
        console.log(
          "Video fullscreen was not allowed by this browser."
        );
      }
    }

    async function enterWebsiteFullscreen() {
      const fullscreenElement = getFullscreenElement();

      if (fullscreenElement) {
        await exitFullscreen();
        return;
      }

      const requestFullscreen =
        websitePage.requestFullscreen ||
        websitePage.webkitRequestFullscreen ||
        websitePage.mozRequestFullScreen ||
        websitePage.msRequestFullscreen;

      if (!requestFullscreen) {
        alert("Fullscreen mode is not supported by this browser.");
        return;
      }

      try {
        await requestFullscreen.call(websitePage);
      } catch {
        console.log(
          "Website fullscreen was not allowed by this browser."
        );
      }
    }

    async function exitFullscreen() {
      const exit =
        document.exitFullscreen ||
        document.webkitExitFullscreen ||
        document.mozCancelFullScreen ||
        document.msExitFullscreen;

      if (exit) {
        await exit.call(document);
      }
    }

    function getFullscreenElement() {
      return (
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement
      );
    }

    function handleFullscreenChange() {
      const fullscreenElement = getFullscreenElement();
      const isFullscreen = Boolean(fullscreenElement);

      fullscreenBar.classList.toggle("hidden", isFullscreen);

      if (
        !isFullscreen &&
        screen.orientation &&
        typeof screen.orientation.unlock === "function"
      ) {
        try {
          screen.orientation.unlock();
        } catch {
          console.log("Orientation unlock is not supported.");
        }
      }
    }

    enterButton.addEventListener("click", () => {
      autoplayEnabled = true;
      welcomeScreen.classList.add("hidden");
    });

    fullscreenBar.addEventListener(
      "click",
      enterWebsiteFullscreen
    );

    searchInput.addEventListener("input", renderVideos);

    [
      "fullscreenchange",
      "webkitfullscreenchange",
      "mozfullscreenchange",
      "MSFullscreenChange"
    ].forEach((eventName) => {
      document.addEventListener(
        eventName,
        handleFullscreenChange
      );
    });

    renderVideos();
  </script>
</body>
</html>
