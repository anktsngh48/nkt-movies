<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NKT Movies</title>

  <style>
    :root {
      --background: #05080f;
      --card: #111827;
      --card-hover: #172237;
      --accent: #00e5ff;
      --text: #e8f0fe;
      --muted: #8b9bb5;
      --border: rgba(0, 229, 255, 0.18);
      --glow: 0 0 30px rgba(0, 229, 255, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    body {
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse 60% 50% at 20% 10%,
          rgba(0, 229, 255, 0.05),
          transparent 60%
        ),
        radial-gradient(
          ellipse 50% 40% at 80% 80%,
          rgba(123, 97, 255, 0.06),
          transparent 60%
        );
    }

    #welcome-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      padding: 24px;
      background: var(--background);
      text-align: center;
    }

    #welcome-screen.hidden {
      display: none;
    }

    #welcome-screen h1,
    header h1 {
      margin: 0;
      color: var(--accent);
      letter-spacing: 0.12em;
      text-shadow: 0 0 18px rgba(0, 229, 255, 0.4);
    }

    #welcome-screen h1 {
      font-size: clamp(2rem, 9vw, 4rem);
    }

    #enter-button {
      padding: 14px 42px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: rgba(0, 229, 255, 0.08);
      color: var(--accent);
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.18);
    }

    #enter-button:hover {
      background: rgba(0, 229, 255, 0.2);
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.4);
    }

    .browser-note {
      position: absolute;
      right: 20px;
      bottom: 24px;
      left: 20px;
      color: var(--muted);
      font-size: 0.75rem;
    }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 760px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 40px;
      overflow: visible;
    }

    #fs-bar {
      display: block;
      width: 100%;
      padding: 12px 20px;
      border: 0;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 229, 255, 0.035);
      color: var(--accent);
      font-size: 0.7rem;
      font-weight: bold;
      letter-spacing: 0.2em;
      text-align: center;
      text-transform: uppercase;
      cursor: pointer;
    }

    #fs-bar:hover {
      background: rgba(0, 229, 255, 0.14);
    }

    #fs-bar.hidden {
      display: none;
    }

    header {
      padding: 26px 20px 22px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }

    header h1 {
      font-size: clamp(1.5rem, 5vw, 2.3rem);
    }

    header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    main {
      padding: 24px 16px;
    }

    #player-box {
      display: none;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-bottom: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #000;
      box-shadow: var(--glow);
    }

    #player-box.active {
      display: block;
    }

    #player-box iframe,
    #player-box video {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    /*
      Video fullscreen mode.

      This makes the video fill the screen in landscape
      when the browser/device supports orientation locking.
    */
    #player-box:fullscreen,
    #player-box:-webkit-full-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      max-width: none;
      aspect-ratio: auto;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: #000;
    }

    #player-box:fullscreen iframe,
    #player-box:fullscreen video,
    #player-box:-webkit-full-screen iframe,
    #player-box:-webkit-full-screen video {
      display: block;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      border: 0;
      object-fit: contain;
    }

    /*
      Website fullscreen mode remains vertically scrollable.
    */
    #website-page:fullscreen {
      display: block;
      width: 100vw;
      height: 100vh;
      max-width: none;
      min-height: 100vh;
      margin: 0;
      padding: 0 0 40px;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--background);
    }

    #website-page:-webkit-full-screen {
      display: block;
      width: 100vw;
      height: 100vh;
      max-width: none;
      min-height: 100vh;
      margin: 0;
      padding: 0 0 40px;
      overflow-x: hidden;
      overflow-y: auto;
      background: var(--background);
    }

    html:has(#website-page:fullscreen),
    body:has(#website-page:fullscreen),
    html:has(#website-page:-webkit-full-screen),
    body:has(#website-page:-webkit-full-screen) {
      overflow: hidden;
    }

    #now-playing {
      display: none;
      margin: 0 0 14px;
      overflow: hidden;
      color: var(--accent);
      font-size: 0.8rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #now-playing.visible {
      display: block;
    }

    .search-box {
      margin-bottom: 20px;
    }

    #search-input {
      width: 100%;
      padding: 13px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      background: var(--card);
      color: var(--text);
      font-size: 0.9rem;
    }

    #search-input::placeholder {
      color: var(--muted);
    }

    #search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.16);
    }

    .section-title {
      margin: 0 0 12px;
      color: var(--text);
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #video-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .video-item {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .video-item:hover {
      border-color: rgba(0, 229, 255, 0.45);
      background: var(--card-hover);
      box-shadow: var(--glow);
      transform: translateY(-1px);
    }

    .video-item.playing {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.16);
    }

    .video-info {
      flex: 1;
      min-width: 0;
    }

    .video-title {
      margin: 0 0 5px;
      overflow: hidden;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: bold;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .video-description {
      margin: 0;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.75rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .video-item.no-description .video-title {
      margin-bottom: 0;
    }

    .video-item.no-description .video-description {
      display: none;
    }

    .open-icon {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 1.3rem;
      opacity: 0.75;
    }

    .empty-message {
      padding: 28px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      main {
        padding: 20px 12px;
      }

      .video-title {
        font-size: 0.82rem;
      }

      .video-description {
        font-size: 0.7rem;
      }
    }
  </style>
</head>

<body>
  <div id="welcome-screen">
    <h1>NKT Movies</h1>

    <button id="enter-button" type="button">
      Let me in
    </button>

    <div class="browser-note">
      Works best in the Brave browser
    </div>
  </div>

  <div class="page" id="website-page">
    <button id="fs-bar" type="button">
      Tap here for fullscreen mode
    </button>

    <header>
      <h1>NKT Movies</h1>
      <p>Select a movie to watch</p>

    <main>
      <div id="player-box"></div>

      <div id="now-playing"></div>

      <div class="search-box">
        <input

          placeholder="Search your movie here"
          aria-label="Search videos"
        >
      </div>

      <h2 class="section-title">
        Available Movies
      </h2>

      <div id="video-list"></div>
    </main>
  </div>

  <script>
    const videos = [

      },
      {

      },
      {
        title: "Phir Hera Pheri",

        tags: "Comedy, Akshay Kumar, Suniel Sunil Shetty, Bipasha Basu, Paresh Rawal",
        url: "https://youtu.be/qhyndgHD04A?t=9"
      },
      {
        title: "Andaz Apna Apna",
        description: "2026",
        tags: "Comedy, Salman Khan, Amir Khan, Aamir, Paresh Rawal, Karishma Kapoor, Raveena Tandon",
        url: "https://youtu.be/49Wta-qwGfI?t=15"
      },
      {
        title: "Chumbak",
        description: "2026",
        tags: "Comedy, web series, tv",
        url: "https://nexdrive.bet/genxfm21657873140/"
      },
      {
        title: "Bigg Boss",
        description: "2026",
        tags: "web series, tv",
        url: "https://nexdrive.bet/genxfm97108433640/"
      }
    ];

    const welcomeScreen =
      document.getElementById("welcome-screen");

    const enterButton =
      document.getElementById("enter-button");

    const websitePage =
      document.getElementById("website-page");

    const fullscreenBar =
      document.getElementById("fs-bar");

    const videoList =
      document.getElementById("video-list");

    const playerBox =
      document.getElementById("player-box");

    const nowPlaying =
      document.getElementById("now-playing");

    const searchInput =
      document.getElementById("search-input");

    let autoplayEnabled = false;

    function getYouTubeVideoInfo(url) {
      try {
        const parsedUrl = new URL(url);
        const hostname = parsedUrl.hostname.toLowerCase();
        const pathname = parsedUrl.pathname;

        let videoId = null;

        if (hostname === "youtu.be") {
          videoId = pathname.substring(1).split("/")[0];
        }

        if (
          hostname.includes("youtube.com") &&
          pathname === "/watch"
        ) {
          videoId = parsedUrl.searchParams.get("v");
        }

        if (
          hostname.includes("youtube.com") &&
          pathname.startsWith("/shorts/")
        ) {
          videoId = pathname.split("/shorts/")[1].split("/")[0];
        }

        if (
          hostname.includes("youtube.com") &&
          pathname.startsWith("/embed/")
        ) {
          videoId = pathname.split("/embed/")[1].split("/")[0];
        }

        if (!videoId) {
          return null;
        }

        let startTime = 0;

        const timestamp =
          parsedUrl.searchParams.get("t") ||
          parsedUrl.searchParams.get("start");

        if (timestamp) {
          if (/^\d+$/.test(timestamp)) {
            startTime = Number(timestamp);
          } else if (/^\d+s$/.test(timestamp)) {
            startTime = Number(timestamp.replace("s", ""));
          } else {
            const match = timestamp.match(
              /^(?:(\d+)h)?(?:(\d+)m)?(?:(\d+)s)?$/
            );

            if (match) {
              startTime =
                Number(match[1] || 0) * 3600 +
                Number(match[2] || 0) * 60 +
                Number(match[3] || 0);
            }
          }
        }

        return {
          videoId,
          startTime
        };
      } catch (error) {
        return null;
      }
    }

    function isDirectVideoFile(url) {
      return /\.(mp4|webm|ogg|mov)(\?.*)?$/i.test(url);
    }

    function clearPlayingStates() {
      document
        .querySelectorAll(".video-item")
        .forEach((item) => {
          item.classList.remove("playing");
        });
    }

    function showNowPlaying(title) {
      nowPlaying.textContent =
        "▶ NOW PLAYING: " + (title || "Untitled video");

      nowPlaying.classList.add("visible");
    }

    async function lockLandscape() {
      try {
        if (
          screen.orientation &&
          screen.orientation.lock
        ) {
          await screen.orientation.lock("landscape");
        }
      } catch (error) {
        /*
          Some browsers do not allow orientation locking.
          Fullscreen playback still works normally there.
        */
        console.log(
          "Landscape orientation lock is not supported."
        );
      }
    }

    async function requestPlayerFullscreen() {
      const requestFullscreen =
        playerBox.requestFullscreen ||
        playerBox.webkitRequestFullscreen ||
        playerBox.mozRequestFullScreen ||
        playerBox.msRequestFullscreen;

      if (!requestFullscreen) {
        return;
      }

      try {
        await requestFullscreen.call(playerBox);

        /*
          Run this after fullscreen starts.
          This is required by many mobile browsers.
        */
        await lockLandscape();
      } catch (error) {
        console.log(
          "Video fullscreen was not allowed by the browser."
        );
      }
    }

    function playYouTubeVideo(
      video,
      selectedItem,
      youtubeInfo
    ) {
      clearPlayingStates();
      selectedItem.classList.add("playing");

      playerBox.innerHTML = "";

      let embedUrl =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(youtubeInfo.videoId) +
        "?autoplay=1&rel=0&playsinline=1";

      if (youtubeInfo.startTime > 0) {
        embedUrl +=
          "&start=" +
          Math.floor(youtubeInfo.startTime);
      }

      const iframe =
        document.createElement("iframe");

      iframe.src = embedUrl;
      iframe.title = video.title || "Video player";

      iframe.allow =
        "accelerometer; autoplay; clipboard-write; " +
        "encrypted-media; gyroscope; picture-in-picture; " +
        "web-share";

      iframe.allowFullscreen = true;

      playerBox.appendChild(iframe);
      playerBox.classList.add("active");

      showNowPlaying(video.title);

      requestPlayerFullscreen();
    }

    function playDirectVideo(video, selectedItem) {
      clearPlayingStates();
      selectedItem.classList.add("playing");

      playerBox.innerHTML = "";

      const videoElement =
        document.createElement("video");

      videoElement.src = video.url;
      videoElement.controls = true;
      videoElement.autoplay = true;
      videoElement.playsInline = true;

      playerBox.appendChild(videoElement);
      playerBox.classList.add("active");

      showNowPlaying(video.title);

      requestPlayerFullscreen();
    }

    function playVideo(video, selectedItem) {
      if (!autoplayEnabled) {
        return;
      }

      const youtubeInfo =
        getYouTubeVideoInfo(video.url);

      if (youtubeInfo) {
        playYouTubeVideo(
          video,
          selectedItem,
          youtubeInfo
        );

        return;
      }

      if (isDirectVideoFile(video.url)) {
        playDirectVideo(video, selectedItem);

        return;
      }

      window.open(
        video.url,
        "_blank",
        "noopener,noreferrer"
      );
    }

    function renderVideos() {
      videoList.innerHTML = "";

      const searchTerm =
        searchInput.value.trim().toLowerCase();

      const filteredVideos = videos.filter((video) => {
        const searchableText = [
          video.title || "",
          video.description || "",
          video.tags || "",
          video.url || ""
        ]
          .join(" ")
          .toLowerCase();

        return (
          searchTerm === "" ||
          searchableText.includes(searchTerm)
        );
      });

      if (filteredVideos.length === 0) {
        videoList.innerHTML = `
          <div class="empty-message">
            No videos match your search.
          </div>
        `;

        return;
      }

      filteredVideos.forEach((video) => {
        const item =
          document.createElement("button");

        item.type = "button";
        item.className = "video-item";

        const info =
          document.createElement("div");

        info.className = "video-info";

        const title =
          document.createElement("h3");

        title.className = "video-title";
        title.textContent =
          video.title || "Untitled video";

        const description =
          document.createElement("p");

        description.className =
          "video-description";

        description.textContent =
          video.description || "";

        info.appendChild(title);
        info.appendChild(description);

        const icon =
          document.createElement("span");

        icon.className = "open-icon";
        icon.setAttribute("aria-hidden", "true");

        if (getYouTubeVideoInfo(video.url)) {
          icon.textContent = "▶";
        } else if (isDirectVideoFile(video.url)) {
          icon.textContent = "▶";
        } else {
          icon.textContent = "↗";
        }

        item.appendChild(info);
        item.appendChild(icon);

        if (
          !video.description ||
          video.description.trim() === ""
        ) {
          item.classList.add("no-description");
        }

        item.addEventListener("click", () => {
          playVideo(video, item);
        });

        videoList.appendChild(item);
      });
    }

    async function toggleWebsiteFullscreen() {
      const fullscreenElement =
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement;

      const exitFullscreen =
        document.exitFullscreen ||
        document.webkitExitFullscreen ||
        document.mozCancelFullScreen ||
        document.msExitFullscreen;

      if (fullscreenElement) {
        if (exitFullscreen) {
          try {
            await exitFullscreen.call(document);

            if (
              screen.orientation &&
              screen.orientation.unlock
            ) {
              screen.orientation.unlock();
            }
          } catch (error) {
            console.log(
              "Could not exit fullscreen mode."
            );
          }
        }

        return;
      }

      const requestFullscreen =
        websitePage.requestFullscreen ||
        websitePage.webkitRequestFullscreen ||
        websitePage.mozRequestFullScreen ||
        websitePage.msRequestFullscreen;

      if (!requestFullscreen) {
        alert(
          "Fullscreen mode is not supported by this browser."
        );

        return;
      }

      try {
        await requestFullscreen.call(websitePage);
      } catch (error) {
        console.log(
          "Website fullscreen was not allowed by the browser."
        );
      }
    }

    function handleFullscreenChange() {
      const fullscreenElement =
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement;

      const websiteIsFullscreen =
        fullscreenElement === websitePage;

      fullscreenBar.classList.toggle(
        "hidden",
        Boolean(fullscreenElement)
      );

      if (websiteIsFullscreen) {
        document.documentElement.style.overflow =
          "hidden";

        document.body.style.overflow =
          "hidden";

        websitePage.style.overflowY =
          "auto";
      } else {
        document.documentElement.style.overflow =
          "";

        document.body.style.overflow =
          "";

        websitePage.style.overflowY =
          "";
      }
    }

    enterButton.addEventListener("click", () => {
      autoplayEnabled = true;
      welcomeScreen.classList.add("hidden");
    });

    fullscreenBar.addEventListener(
      "click",
      toggleWebsiteFullscreen
    );

    searchInput.addEventListener(
      "input",
      renderVideos
    );

    [
      "fullscreenchange",
      "webkitfullscreenchange",
      "mozfullscreenchange",
      "MSFullscreenChange"
    ].forEach((eventName) => {
      document.addEventListener(
        eventName,
        handleFullscreenChange
      );
    });

    renderVideos();
  </script>
</body>
</html>
