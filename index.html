<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NKT Movies</title>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Sora:wght@400;500;600&display=swap");

    :root {
      --bg: #05080f;
      --card: #111827;
      --accent: #00e5ff;
      --accent2: #7b61ff;
      --text: #e8f0fe;
      --muted: #5a6a82;
      --border: rgba(0, 229, 255, 0.12);
      --glow: 0 0 30px rgba(0, 229, 255, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Sora", sans-serif;
      overflow-x: hidden;
    }

    body {
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse 60% 50% at 20% 10%,
          rgba(0, 229, 255, 0.05),
          transparent 60%
        ),
        radial-gradient(
          ellipse 50% 40% at 80% 80%,
          rgba(123, 97, 255, 0.06),
          transparent 60%
        );
    }

    /* Welcome screen */

    #welcome-screen {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      background: var(--bg);
    }

    #welcome-screen.hidden {
      display: none;
    }

    #welcome-screen h1 {
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(2rem, 9vw, 4rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(0, 229, 255, 0.4));
    }

    #enter-button {
      padding: 14px 42px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      background: rgba(0, 229, 255, 0.08);
      color: var(--accent);
      font-family: "Orbitron", sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.18);
      transition: 0.2s ease;
    }

    #enter-button:hover {
      background: rgba(0, 229, 255, 0.2);
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.4);
      transform: translateY(-2px);
    }

    /* Main page */

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    #fs-bar {
      width: 100%;
      padding: 8px 20px;
      border-bottom: 1px solid rgba(0, 229, 255, 0.09);
      background: rgba(0, 229, 255, 0.035);
      color: var(--accent);
      font-family: "Orbitron", sans-serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-align: center;
      text-transform: uppercase;
      cursor: pointer;
      user-select: none;
    }

    #fs-bar.hidden {
      display: none;
    }

    header {
      padding: 26px 20px 22px;
      border-bottom: 1px solid rgba(0, 229, 255, 0.08);
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-family: "Orbitron", sans-serif;
      font-size: clamp(1.5rem, 5vw, 2.3rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      filter: drop-shadow(0 0 18px rgba(0, 229, 255, 0.4));
    }

    header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    main {
      padding: 24px 16px;
    }

    #player-box {
      display: none;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      margin-bottom: 22px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #000;
      box-shadow:
        0 0 50px rgba(0, 229, 255, 0.13),
        0 0 100px rgba(123, 97, 255, 0.09);
    }

    #player-box.active {
      display: block;
    }

    #player-box iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    #player-box:fullscreen {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      aspect-ratio: auto;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: #000;
    }

    #player-box:fullscreen iframe {
      width: 100vw;
      height: 100vh;
    }

    #player-box:-webkit-full-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      margin: 0;
      border: 0;
      border-radius: 0;
      background: #000;
    }

    #player-box:-webkit-full-screen iframe {
      width: 100vw;
      height: 100vh;
    }

    #now-playing {
      display: none;
      margin: 0 0 14px;
      color: var(--accent);
      font-size: 0.78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #now-playing.visible {
      display: block;
    }

    .section-title {
      margin: 0 0 12px;
      color: var(--text);
      font-family: "Orbitron", sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Video area and alphabet menu */

    .video-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 48px;
      gap: 16px;
      align-items: start;
    }

    #video-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
      min-width: 0;
    }

    .alphabet-filter {
      position: sticky;
      top: 16px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      width: 48px;
    }

    .alphabet-button {
      width: 48px;
      height: 30px;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: rgba(17, 24, 39, 0.85);
      color: var(--muted);
      font-family: "Orbitron", sans-serif;
      font-size: 0.62rem;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .alphabet-button:hover,
    .alphabet-button.active {
      border-color: var(--accent);
      background: rgba(0, 229, 255, 0.14);
      color: var(--accent);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.2);
    }

    .alphabet-button.disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* Video cards */

    .video-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition:
        border-color 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease,
        transform 0.2s ease;
    }

    .video-item:hover {
      border-color: rgba(0, 229, 255, 0.45);
      background: #172237;
      box-shadow: var(--glow);
      transform: translateY(-1px);
    }

    .video-item.playing {
      border-color: var(--accent);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.16);
    }

    .video-info {
      flex: 1;
      min-width: 0;
    }

    .video-title {
      margin: 0 0 5px;
      color: var(--text);
      font-size: 0.84rem;
      font-weight: 600;
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-item.no-description .video-title {
      margin-bottom: 0;
    }

    .video-description {
      margin: 0;
      color: var(--muted);
      font-size: 0.7rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .video-item.no-description .video-description {
      display: none;
    }

    .open-icon {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 1.35rem;
      opacity: 0.5;
    }

    .empty-message {
      padding: 28px 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 480px) {
      main {
        padding: 20px 12px;
      }

      #player-box {
        border-radius: 10px;
      }

      .video-layout {
        grid-template-columns: minmax(0, 1fr) 40px;
        gap: 8px;
      }

      .alphabet-filter {
        width: 40px;
      }

      .alphabet-button {
        width: 40px;
        height: 27px;
        font-size: 0.55rem;
      }

      .video-title {
        font-size: 0.76rem;
      }

      .video-description {
        font-size: 0.65rem;
      }

      .open-icon {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div id="welcome-screen">
    <h1>NKT Movies</h1>
    <button id="enter-button" type="button">Enter</button>
  </div>

  <div class="page">
    <div id="fs-bar" onclick="enterFullscreen()">
      Tap here for fullscreen mode
    </div>

    <header>
      <h1>NKT Movies</h1>
      <p>Select a video to watch</p>
    </header>

    <main>
      <div id="player-box"></div>

      <div id="now-playing"></div>

      <h2 class="section-title">Available Videos</h2>

      <div class="video-layout">
        <div id="video-list"></div>

        <nav
          class="alphabet-filter"
          id="alphabet-filter"
          aria-label="Filter videos alphabetically"
        ></nav>
      </div>
    </main>
  </div>

  <script>
    /*
      Add your videos here.

      The description is optional.
      The video title determines which alphabet letter it belongs to.
    */

    const videos = [
      {
        title: "Welcome Video",
        description: "Introduction video",
        youtubeUrl: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
      },
      {
        title: "Tutorial",
        description: "Step-by-step tutorial",
        youtubeUrl: "https://www.youtube.com/watch?v=VIDEO_ID_2"
      },
      {
        title: "Event Highlights",
        description: "Highlights from the event",
        youtubeUrl: "https://youtu.be/VIDEO_ID_3"
      },
      {
        title: "Movie Night",
        description: "Featured movie night video",
        youtubeUrl: "https://www.youtube.com/watch?v=VIDEO_ID_4"
      },
      {
        title: "Adventure Film",
        description: "An adventure movie",
        youtubeUrl: "https://www.youtube.com/watch?v=VIDEO_ID_5"
      }
    ];

    const welcomeScreen = document.getElementById("welcome-screen");
    const enterButton = document.getElementById("enter-button");
    const videoList = document.getElementById("video-list");
    const playerBox = document.getElementById("player-box");
    const nowPlaying = document.getElementById("now-playing");
    const alphabetFilter = document.getElementById("alphabet-filter");

    let autoplayEnabled = false;
    let selectedLetter = "ALL";
    let validVideos = [];

    function getYouTubeVideoId(url) {
      try {
        const parsedUrl = new URL(url);
        const hostname = parsedUrl.hostname.toLowerCase();
        const pathname = parsedUrl.pathname;

        if (hostname === "youtu.be") {
          return pathname.substring(1).split("/")[0];
        }

        if (
          hostname.includes("youtube.com") &&
          pathname === "/watch"
        ) {
          return parsedUrl.searchParams.get("v");
        }

        if (
          hostname.includes("youtube.com") &&
          pathname.startsWith("/shorts/")
        ) {
          return pathname.split("/shorts/")[1].split("/")[0];
        }

        if (
          hostname.includes("youtube.com") &&
          pathname.startsWith("/embed/")
        ) {
          return pathname.split("/embed/")[1].split("/")[0];
        }

        return null;
      } catch {
        return null;
      }
    }

    function prepareVideos() {
      validVideos = videos
        .map((video) => ({
          ...video,
          videoId: getYouTubeVideoId(video.youtubeUrl)
        }))
        .filter((video) => video.videoId);
    }

    function getVideoLetter(video) {
      const title = (video.title || "").trim().toUpperCase();
      const firstCharacter = title.charAt(0);

      return /^[A-Z]$/.test(firstCharacter)
        ? firstCharacter
        : "#";
    }

    function renderAlphabetFilter() {
      alphabetFilter.innerHTML = "";

      const allButton = document.createElement("button");

      allButton.type = "button";
      allButton.className = "alphabet-button";
      allButton.textContent = "ALL";

      if (selectedLetter === "ALL") {
        allButton.classList.add("active");
      }

      allButton.addEventListener("click", () => {
        selectedLetter = "ALL";
        renderAlphabetFilter();
        renderVideos();
      });

      alphabetFilter.appendChild(allButton);

      const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

      letters.forEach((letter) => {
        const button = document.createElement("button");
        const hasVideos = validVideos.some(
          (video) => getVideoLetter(video) === letter
        );

        button.type = "button";
        button.className = "alphabet-button";
        button.textContent = letter;

        if (selectedLetter === letter) {
          button.classList.add("active");
        }

        if (!hasVideos) {
          button.classList.add("disabled");
          button.disabled = true;
        }

        button.addEventListener("click", () => {
          selectedLetter = letter;
          renderAlphabetFilter();
          renderVideos();
        });

        alphabetFilter.appendChild(button);
      });

      const hasNumberedVideos = validVideos.some(
        (video) => getVideoLetter(video) === "#"
      );

      if (hasNumberedVideos) {
        const numberButton = document.createElement("button");

        numberButton.type = "button";
        numberButton.className = "alphabet-button";
        numberButton.textContent = "#";

        if (selectedLetter === "#") {
          numberButton.classList.add("active");
        }

        numberButton.addEventListener("click", () => {
          selectedLetter = "#";
          renderAlphabetFilter();
          renderVideos();
        });

        alphabetFilter.appendChild(numberButton);
      }
    }

    function renderVideos() {
      videoList.innerHTML = "";

      const filteredVideos =
        selectedLetter === "ALL"
          ? validVideos
          : validVideos.filter(
              (video) => getVideoLetter(video) === selectedLetter
            );

      if (filteredVideos.length === 0) {
        videoList.innerHTML = `
          <div class="empty-message">
            No videos found for this letter.
          </div>
        `;
        return;
      }

      filteredVideos.forEach((video) => {
        const item = document.createElement("button");

        item.className = "video-item";
        item.type = "button";

        item.innerHTML = `
          <div class="video-info">
            <h3 class="video-title"></h3>
            <p class="video-description"></p>
          </div>

          <span class="open-icon">›</span>
        `;

        const titleElement = item.querySelector(".video-title");
        const descriptionElement =
          item.querySelector(".video-description");

        titleElement.textContent = video.title || "Untitled video";

        const description =
          typeof video.description === "string"
            ? video.description.trim()
            : "";

        descriptionElement.textContent = description;

        if (!description) {
          item.classList.add("no-description");
        }

        item.addEventListener("click", () => {
          playVideo(video.videoId, video.title);
        });

        videoList.appendChild(item);
      });
    }

    function playVideo(videoId, title) {
      if (!autoplayEnabled) {
        return;
      }

      document.querySelectorAll(".video-item").forEach((item) => {
        item.classList.remove("playing");
      });

      const clickedItem = [...document.querySelectorAll(".video-item")]
        .find((item) => {
          const titleElement = item.querySelector(".video-title");
          return titleElement && titleElement.textContent === title;
        });

      if (clickedItem) {
        clickedItem.classList.add("playing");
      }

      playerBox.innerHTML = "";

      const iframe = document.createElement("iframe");

      iframe.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoId) +
        "?autoplay=1&rel=0&playsinline=1";

      iframe.title = title || "Video player";

      iframe.allow =
        "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";

      iframe.allowFullscreen = true;

      playerBox.appendChild(iframe);
      playerBox.classList.add("active");

      nowPlaying.textContent =
        "▶ NOW PLAYING: " + (title || "Untitled video");

      nowPlaying.classList.add("visible");

      requestPlayerFullscreen();
    }

    async function requestPlayerFullscreen() {
      const requestFullscreen =
        playerBox.requestFullscreen ||
        playerBox.webkitRequestFullscreen ||
        playerBox.mozRequestFullScreen ||
        playerBox.msRequestFullScreen;

      if (!requestFullscreen) {
        return;
      }

      try {
        await requestFullscreen.call(playerBox);

        if (
          screen.orientation &&
          screen.orientation.lock
        ) {
          await screen.orientation.lock("landscape");
        }
      } catch (error) {
        console.log(
          "Fullscreen or landscape mode is not supported by this browser."
        );
      }
    }

    function enterFullscreen() {
      if (playerBox.classList.contains("active")) {
        requestPlayerFullscreen();
      }
    }

    function handleFullscreenChange() {
      const isFullscreen =
        document.fullscreenElement ||
        document.webkitFullscreenElement ||
        document.mozFullScreenElement ||
        document.msFullscreenElement;

      document
        .getElementById("fs-bar")
        .classList.toggle("hidden", Boolean(isFullscreen));

      if (
        !isFullscreen &&
        screen.orientation &&
        screen.orientation.unlock
      ) {
        screen.orientation.unlock();
      }
    }

    enterButton.addEventListener("click", () => {
      autoplayEnabled = true;
      welcomeScreen.classList.add("hidden");
    });

    [
      "fullscreenchange",
      "webkitfullscreenchange",
      "mozfullscreenchange",
      "MSFullscreenChange"
    ].forEach((eventName) => {
      document.addEventListener(eventName, handleFullscreenChange);
    });

    prepareVideos();
    renderAlphabetFilter();
    renderVideos();
  </script>
</body>
</html>
